name: Tune weights

# Tunes the computer's evaluation weights by self-play (see packages/tools
# README, "Tuning the weights"). Started by hand:
#   gh workflow run tune.yml -f iterations=200
# The tuned weights land in the run's summary and as an artifact; review them
# and check them with a Long runs ai-match before replacing the defaults.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations (each one batch of matches)
        default: '200'
      matches:
        description: Matches per iteration
        default: '12'
      level:
        description: Computer level both sides play at
        default: novice
      rules:
        description: Rules config id
        default: rules-v12
      seed:
        description: Seed for the nudges (a different seed gives a different run)
        default: '1'

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tune (${{ inputs.iterations }} iterations of ${{ inputs.matches }} matches at ${{ inputs.level }})
        env:
          ITERATIONS: ${{ inputs.iterations }}
          MATCHES: ${{ inputs.matches }}
          LEVEL: ${{ inputs.level }}
          RULES: ${{ inputs.rules }}
          SEED: ${{ inputs.seed }}
        run: |
          set -o pipefail
          echo "Cores: $(nproc)"
          pnpm --filter @orcball/tools tune --iterations "$ITERATIONS" --matches "$MATCHES" --level "$LEVEL" \
            --rules "$RULES" --seed "$SEED" --out "$GITHUB_WORKSPACE/tuned.json" | tee progress.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tuned-weights
          path: |
            tuned.json
            progress.txt
          if-no-files-found: warn
      - name: Report to the summary
        if: always()
        run: |
          if [ -f tuned.json ]; then
            { echo '### Tuned weights'; echo '```json'; cat tuned.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No tuned weights; see the logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo '### Last iterations'; echo '```text'; tail -n 10 progress.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
