name: Long runs

# Runs too slow for every PR, started by hand from the Actions tab or with
#   gh workflow run long-runs.yml -f run=ai-match -f home=novice -f away=random -f matches=200
# An ai-match run is split into shards that play in parallel, each printing a
# progress line per match in its log; a last job combines them into one
# report in the run's summary. A tune run tunes the computer's weights by
# self-play (packages/tools README, "Tuning the weights").

on:
  workflow_dispatch:
    inputs:
      run:
        description: What to run
        type: choice
        options: [ai-match, bench, tune]
        default: ai-match
      home:
        description: 'ai-match: home contender (random, novice, intermediate, expert)'
        default: novice
      away:
        description: 'ai-match: away contender'
        default: random
      matches:
        description: 'ai-match: matches in the run'
        default: '200'
      rules:
        description: 'ai-match: rules config id'
        default: rules-v12
      rosters:
        description: 'ai-match: home and away roster ids'
        default: orcs,elves
      budget-ms:
        description: 'ai-match: thinking time per decision, in ms'
        default: '10000'
      first-seed:
        description: 'ai-match: first seed'
        default: '1'
      shards:
        description: 'ai-match: parallel jobs to split the run into (1-20)'
        default: '4'
      bench-matches:
        description: 'bench: random matches to take positions from'
        default: '5'
      iterations:
        description: 'tune: iterations, each one batch of matches (about 2 minutes each)'
        default: '150'
      tune-matches:
        description: 'tune: matches per iteration'
        default: '12'
      level:
        description: 'tune: computer level both sides play at'
        default: novice
      tune-seed:
        description: 'tune: seed for the nudges (another seed gives another run)'
        default: '1'

jobs:
  shards:
    if: inputs.run == 'ai-match'
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          if ! [[ "$SHARDS" =~ ^[0-9]+$ ]] || [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then
            echo "::error::shards must be a number from 1 to 20, not '$SHARDS'"
            exit 1
          fi
          echo "list=$(jq -cn --argjson n "$SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  ai-match:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.list) }}
    name: ai-match shard ${{ matrix.shard }}/${{ inputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ${{ inputs.home }} against ${{ inputs.away }}, shard ${{ matrix.shard }} of ${{ inputs.shards }} (${{ inputs.matches }} matches in all)
        env:
          HOME_SIDE: ${{ inputs.home }}
          AWAY: ${{ inputs.away }}
          MATCHES: ${{ inputs.matches }}
          RULES: ${{ inputs.rules }}
          ROSTERS: ${{ inputs.rosters }}
          BUDGET_MS: ${{ inputs.budget-ms }}
          FIRST_SEED: ${{ inputs.first-seed }}
          SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
          RESULTS: results/shard-${{ matrix.shard }}.json
        run: |
          mkdir -p results
          pnpm --filter @orcball/tools ai-match --home "$HOME_SIDE" --away "$AWAY" --matches "$MATCHES" \
            --rules "$RULES" --rosters "$ROSTERS" --budget-ms "$BUDGET_MS" --first-seed "$FIRST_SEED" \
            --shard "$SHARD" --results "$RESULTS"
      - uses: actions/upload-artifact@v7
        with:
          name: ai-match-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  report:
    needs: ai-match
    if: always() && inputs.run == 'ai-match'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: ai-match-shard-*
          path: results
          merge-multiple: true
      - name: Combine the shards
        env:
          HOME_SIDE: ${{ inputs.home }}
          AWAY: ${{ inputs.away }}
          MATCHES: ${{ inputs.matches }}
          RULES: ${{ inputs.rules }}
          ROSTERS: ${{ inputs.rosters }}
          BUDGET_MS: ${{ inputs.budget-ms }}
          FIRST_SEED: ${{ inputs.first-seed }}
        run: |
          mkdir -p results
          pnpm --filter @orcball/tools ai-match --home "$HOME_SIDE" --away "$AWAY" --matches "$MATCHES" \
            --rules "$RULES" --rosters "$ROSTERS" --budget-ms "$BUDGET_MS" --first-seed "$FIRST_SEED" \
            --combine results --report report.txt
      - name: Report to the summary
        if: always()
        run: |
          if [ -f report.txt ]; then
            { echo '```text'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report; see the logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

  bench:
    if: inputs.run == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Engine benchmark
        env:
          BENCH_MATCHES: ${{ inputs.bench-matches }}
        run: |
          set -o pipefail
          pnpm --filter @orcball/tools bench | tee report.txt
      - name: Report to the summary
        if: always()
        run: |
          { echo '```text'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  tune:
    if: inputs.run == 'tune'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tune (${{ inputs.iterations }} iterations of ${{ inputs.tune-matches }} matches at ${{ inputs.level }})
        env:
          ITERATIONS: ${{ inputs.iterations }}
          MATCHES: ${{ inputs.tune-matches }}
          LEVEL: ${{ inputs.level }}
          RULES: ${{ inputs.rules }}
          ROSTERS: ${{ inputs.rosters }}
          BUDGET_MS: ${{ inputs.budget-ms }}
          SEED: ${{ inputs.tune-seed }}
        run: |
          set -o pipefail
          echo "Cores: $(nproc)"
          pnpm --filter @orcball/tools tune --iterations "$ITERATIONS" --matches "$MATCHES" --level "$LEVEL" \
            --rules "$RULES" --rosters "$ROSTERS" --budget-ms "$BUDGET_MS" --seed "$SEED" \
            --out "$GITHUB_WORKSPACE/tuned.json" | tee progress.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tuned-weights
          path: |
            tuned.json
            progress.txt
          if-no-files-found: warn
      - name: Report to the summary
        if: always()
        run: |
          if [ -f tuned.json ]; then
            { echo '### Tuned weights'; echo '```json'; cat tuned.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No tuned weights; see the logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo '### Last iterations'; echo '```text'; tail -n 10 progress.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
